<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrinterMan's Art Club — The Chill Creative Zone</title>
<meta name="description" content="A Discord for artists and art lovers to hang out, share work, and generally vibe together. Everyone is welcome to share, game, and laugh.">
<link rel="canonical" href="https://printermanart.club/">
<meta name="theme-color" content="#5865F2">

<link rel="icon" href="/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/favicon-180.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="PrinterMan's Art Club">
<meta property="og:title" content="PrinterMan's Art Club — The Chill Creative Zone">
<meta property="og:description" content="A Discord for artists and art lovers to hang out, share work, and generally vibe together. Everyone is welcome to share, game, and laugh.">
<meta property="og:url" content="https://printermanart.club/">
<meta property="og:image" content="https://printermanart.club/img/og-home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Blue irises on a gold ground, with the words PrinterMan's Art Club over them.">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Brand tokens — see README */
    --blurple:       #5865F2;
    --blurple-text:  #99A2F7;
    --ground:        #101218;
    --panel:         #171A22;
    --border:        #272B36;
    --text:          #FFFFFF;
    --text-muted:    #9BA0AE;
    --text-dim:      #7A8094;
    --accent:        #D4A24C;   /* editable: swap to retheme the page */

    --font: 'Poppins', system-ui, -apple-system, sans-serif;
    --maxw: 640px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background: var(--ground);
    color: var(--text-muted);
    font-family: var(--font);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: var(--maxw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
  }

  .card-body { padding: 36px 36px 44px; }

  /* Header band — public domain artwork, see img credit in README */
  .banner { position: relative; }

  .banner img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 5;
    object-fit: cover;
  }

  .banner-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 16px;
  }

  /* Outline drawn behind the glyph with layered shadows, not -webkit-text-stroke,
     which cuts into the letterform. */
  .banner h1 {
    margin: 0;
    font-size: clamp(1.4rem, 5.4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #fff;
    text-shadow:
      3px 0 0 #0A0A0C, -3px 0 0 #0A0A0C, 0 3px 0 #0A0A0C, 0 -3px 0 #0A0A0C,
      2px 2px 0 #0A0A0C, -2px 2px 0 #0A0A0C, 2px -2px 0 #0A0A0C, -2px -2px 0 #0A0A0C,
      0 3px 10px rgba(0,0,0,0.4);
  }

  .banner .tag {
    margin: 0;
    font-size: clamp(0.95rem, 2.6vw, 1.3rem);
    font-weight: 600;
    color: #fff;
    text-shadow:
      2px 0 0 #0A0A0C, -2px 0 0 #0A0A0C, 0 2px 0 #0A0A0C, 0 -2px 0 #0A0A0C,
      1.5px 1.5px 0 #0A0A0C, -1.5px 1.5px 0 #0A0A0C, 1.5px -1.5px 0 #0A0A0C, -1.5px -1.5px 0 #0A0A0C,
      0 2px 8px rgba(0,0,0,0.4);
  }

  .mark {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 20px;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 600;
    line-height: 1.25;
    color: var(--text);
    margin: 0 0 14px;
  }

  .sub {
    font-size: 1rem;
    font-weight: 300;
    margin: 0 auto 32px;
    max-width: 44ch;
  }

  /* Header menu — a band of equal cells under the banner, divided by a
     hairline. Deliberately monochrome: the Join button keeps the only colour
     on the page. Caps and letterspacing match the link strip on the news and
     art pages, so navigation reads the same everywhere on the site. */
  .menu {
    display: flex;
    background: var(--ground);
    border-bottom: 1px solid var(--border);
  }

  .menu a {
    flex: 1 1 0;
    min-width: 0;
    padding: 15px 12px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    line-height: 1.35;
    text-transform: uppercase;
    text-align: center;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .menu a + a { border-left: 1px solid var(--border); }

  .menu a:hover {
    color: var(--blurple-text);
    background: var(--panel);
  }

  .menu a:focus-visible {
    outline: 2px solid var(--blurple-text);
    outline-offset: -2px;
  }

  @media (max-width: 400px) {
    .menu a { letter-spacing: 0.08em; padding: 13px 8px; }
  }

  .cta {
    display: inline-block;
    background: var(--blurple);
    color: #fff;
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 8px;
    transition: filter 0.15s ease;
  }

  .cta:hover { filter: brightness(1.12); }

  footer {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  footer a { color: var(--blurple-text); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .card-body { padding: 28px 22px 34px; }
  }
</style>
</head>
<body>

  <main>
    <!-- Artwork: "Irises at Yatsuhashi (Eight Bridges)", Ogata Korin, after 1709.
         The Metropolitan Museum of Art, Open Access (public domain).
         https://www.metmuseum.org/art/collection/search/39664 -->
    <header class="banner">
      <img src="img/header-irises.jpg" alt="Detail of Ogata Korin's screen painting Irises at Yatsuhashi: deep blue irises and green blades across a gold ground, with a plank bridge crossing above them.">
      <div class="banner-text">
        <h1>PrinterMan's Art Club</h1>
        <p class="tag">The Chill Creative Zone</p>
      </div>
    </header>

    <nav class="menu">
      <a href="/news.html">Daily News Briefing</a>
      <a href="/showcase.html">Weekly Art History</a>
    </nav>

    <div class="card-body">
    <a class="cta" href="https://discord.gg/nn3xjcS745">Join Now</a>

    <footer>
      printermanart.club &nbsp;·&nbsp; <a href="/about.html">About</a> &nbsp;·&nbsp; &copy; 2026 PrinterMan
    </footer>
    </div>
  </main>

</body>
</html>
