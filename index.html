<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[ PAGE TITLE GOES HERE ]</title>
<meta name="description" content="[ META DESCRIPTION GOES HERE ]">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Brand tokens — see README */
    --blurple:       #5865F2;
    --blurple-text:  #99A2F7;
    --ground:        #101218;
    --panel:         #171A22;
    --border:        #272B36;
    --text:          #FFFFFF;
    --text-muted:    #9BA0AE;
    --text-dim:      #7A8094;
    --accent:        #D4A24C;   /* editable: swap to retheme the page */

    --font: 'Poppins', system-ui, -apple-system, sans-serif;
    --maxw: 640px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background: var(--ground);
    color: var(--text-muted);
    font-family: var(--font);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: var(--maxw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 48px 36px;
    text-align: center;
  }

  .mark {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 20px;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 600;
    line-height: 1.25;
    color: var(--text);
    margin: 0 0 14px;
  }

  .sub {
    font-size: 1rem;
    font-weight: 300;
    margin: 0 auto 32px;
    max-width: 44ch;
  }

  .cta {
    display: inline-block;
    background: var(--blurple);
    color: #fff;
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 8px;
    transition: filter 0.15s ease;
  }

  .cta:hover { filter: brightness(1.12); }

  footer {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  footer a { color: var(--blurple-text); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    main { padding: 36px 22px; }
  }
</style>
</head>
<body>

  <main>
    <p class="mark">[ SMALL LABEL GOES HERE ]</p>

    <h1>[ TAGLINE GOES HERE ]</h1>

    <p class="sub">[ SUBHEAD GOES HERE ]</p>

    <a class="cta" href="https://discord.gg/nn3xjcS745">[ CTA LABEL GOES HERE ]</a>

    <footer>
      printermanart.club &nbsp;·&nbsp;
      <a href="https://discord.gg/nn3xjcS745">discord.gg/nn3xjcS745</a>
      <br>
      &copy; 2026 PrinterMan
    </footer>
  </main>

</body>
</html>
