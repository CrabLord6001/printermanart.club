<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Processor — rough board</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32">

<style>
/* ============================================================
   Color Processor — step one, the rough board
   ============================================================
   Falling pairs, Puyo rules: four or more of a color touching in
   any shape clear, what is left falls, and anything that lands in
   a new group clears again. Each pass through that loop is a link
   of the chain and pays more than the last.

   On purpose this is plain -- flat tiles, no toner, no laser, no
   artwork. It is here to answer whether steering and chaining is
   fun before any of the look is built on top of it.

   The logic below is written to be portable. When the real
   renderer arrives it replaces paint() and nothing else.
   ============================================================ */

:root {
  --ground: #101218;
  --panel:  #171A22;
  --border: #272B36;
  --text:   #FFFFFF;
  --muted:  #9BA0AE;
  --dim:    #7A8094;
  --accent: #D4A24C;

  --cyan:    #22B8E6;
  --magenta: #E8459B;
  --yellow:  #E8C53D;
  --key:     #4A5162;

  /* the extra cartridges */
  --lcyan:   #8FD9F0;
  --lmagenta:#F5A3CE;
  --white:   #EDEAE0;

  --font: 'Poppins', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--ground);
  color: var(--muted);
  font-family: var(--font);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 10px 12px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: none;
}

/* ---- readout ---- */

.head {
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  padding: 0 2px 6px;
}

.title {
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
  flex: 1 1 100%;
}

.stat {
  font-size: 0.64rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

.stat b { color: var(--text); font-size: 0.92rem; margin-left: 4px; }
.stat.goal b { color: var(--accent); }

/* ---- the machine ---- */

.rig {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.stack { display: flex; flex-direction: column; align-items: center; }

/* four tanks across the top of the well */
/* One tank per cartridge, so the count is visible before you start. */
.hoppers {
  width: 100%;
  display: grid;
  gap: 5px;
  margin-bottom: 6px;
}

.hopper {
  position: relative;
  height: 34px;
  border-radius: 6px 6px 3px 3px;
  border: 1px solid var(--border);
  background: #0C0E13;
  overflow: hidden;
}

.hopper .fill {
  position: absolute;
  left: 3px; right: 3px; bottom: 3px;
  border-radius: 2px 2px 3px 3px;
  transition: height 0.35s ease;
}

.hopper .tag {
  position: absolute;
  left: 0; right: 0; top: 2px;
  text-align: center;
  font-size: 0.54rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--dim);
  z-index: 1;
}

.hopper.c  .fill { background: var(--cyan); }
.hopper.m  .fill { background: var(--magenta); }
.hopper.y  .fill { background: var(--yellow); }
.hopper.k  .fill { background: var(--key); }
.hopper.lc .fill { background: var(--lcyan); }
.hopper.lm .fill { background: var(--lmagenta); }
.hopper.w  .fill { background: var(--white); }

/* ---- the well ---- */

.well {
  background: #0C0E13;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
}

.cell {
  border-radius: 50%;
  background: transparent;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
}

.cell.c  { background: var(--cyan); box-shadow: none; }
.cell.m  { background: var(--magenta); box-shadow: none; }
.cell.y  { background: var(--yellow); box-shadow: none; }
.cell.k  { background: var(--key); box-shadow: none; }
.cell.lc { background: var(--lcyan); box-shadow: none; }
.cell.lm { background: var(--lmagenta); box-shadow: none; }
.cell.w  { background: var(--white); box-shadow: none; }

/* A clump of four or more flashes before it goes. A ring rather than a white
   fill, so it still reads when white is one of the inks on the board. */
.cell.hit { box-shadow: 0 0 0 3px #fff, 0 0 10px 2px rgba(255,255,255,0.6); }

/* Magnetic ink: an ordinary colored drop wearing a gold ring, rather than a
   color of its own. Nothing new to tell apart, and the ring reads at any
   size. When it lands it pulls its own color out of a diagonal and into
   line -- the near miss that makes people swear at the screen. */
.cell.mag { box-shadow: inset 0 0 0 3px var(--accent), 0 0 6px rgba(212,162,76,0.5); }

/* A corrupted supply. Green appears nowhere in CMYK, so there is no chance
   of reading it as ink. */
.cell.virus {
  background: #11161C;
  box-shadow: inset 0 0 0 3px #43D98B, 0 0 7px rgba(67,217,139,0.4);
}

/* The piece on its way down sits slightly proud of the pile. A filter rather
   than a shadow, so it does not paint over the gold or green ring a wildcard
   is wearing. */
.cell.live { filter: brightness(1.12) drop-shadow(0 0 5px rgba(255,255,255,0.4)); }

/* ---- side panel ---- */

.side {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: 40px;
  min-width: 62px;
}

.nextbox {
  background: #0C0E13;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px;
}

.nextbox .lbl {
  font-size: 0.52rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
  margin-bottom: 5px;
}

.nextgrid { display: grid; grid-template-rows: repeat(2, 1fr); gap: 3px; justify-items: center; }
.nextgrid div { width: 20px; height: 20px; border-radius: 50%; }

.chainnow {
  text-align: center;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  min-height: 1em;
}

/* ---- foot ---- */

.foot {
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 8px;
}

.msg { flex: 1 1 100%; font-size: 0.78rem; color: var(--muted); min-height: 1.2em; margin: 0; }
.msg b { color: var(--accent); }

label.tune {
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 4px;
}

label.tune select {
  font-family: var(--font);
  font-size: 0.74rem;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
}

label.tune input {
  width: 56px;
  font-family: var(--font);
  font-size: 0.78rem;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
}

button.go {
  font-family: var(--font);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text);
  background: #5865F2;
  border: 0;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}

button.go:hover { background: #4653E0; }

.hint {
  flex: 1 1 100%;
  font-size: 0.62rem;
  color: var(--dim);
  margin: 2px 0 0;
}

/* ---- end of a print ---- */

.over {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 17, 0.93);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  padding: 24px;
}

.over[hidden] { display: none; }
.over h2 { margin: 0; font-size: 1.4rem; color: var(--text); font-weight: 600; }
.over p  { margin: 0; font-size: 0.95rem; max-width: 34ch; }
</style>
</head>
<body>

  <div class="head">
    <p class="title">Color Processor &mdash; rough board</p>
    <span class="stat">Points <b id="pts">0</b></span>
    <span class="stat goal">Target <b id="tg">1000</b></span>
    <span class="stat">Best chain <b id="bc">0</b></span>
  </div>

  <div class="rig">
    <div class="stack">
      <div class="hoppers" id="hoppers"></div>
      <div class="well"><div class="grid" id="grid"></div></div>
    </div>

    <div class="side">
      <div class="nextbox">
        <p class="lbl">Next</p>
        <div class="nextgrid"><div id="nb"></div><div id="na"></div></div>
      </div>
      <p class="chainnow" id="chainnow">&nbsp;</p>
    </div>
  </div>

  <div class="foot">
    <p class="msg" id="msg">Four or more touching clears.</p>
    <label class="tune">Cartridges
      <select id="setInks">
        <option value="office" selected>4 &mdash; CMYK</option>
        <option value="five-lc">5 &mdash; + light cyan</option>
        <option value="five-w">5 &mdash; + white</option>
        <option value="photo">6 &mdash; photo</option>
      </select>
    </label>
    <label class="tune">Target <input id="setTarget" type="number" min="100" step="100" value="1000"></label>
    <label class="tune">Fall ms <input id="setFall" type="number" min="100" step="50" value="700"></label>
    <button class="go" id="again" type="button">New print</button>
    <p class="hint" id="hint">Drag to steer &middot; tap to rotate &middot; swipe down to drop</p>
  </div>

  <div class="over" id="over" hidden>
    <h2 id="overTitle">&nbsp;</h2>
    <p id="overText"></p>
    <button class="go" id="overBtn" type="button">New print</button>
  </div>

<script>
/* ============================================================
   Logic
   ============================================================ */

const COLS = 6, ROWS = 12;

/* How many cartridges the machine has. Four is an office printer and it is
   the beginner setting -- with only four, clumps half assemble themselves.
   More inks means fewer accidents and more planning, which is the real
   difficulty dial; fall speed only adds panic. */
const PALETTES = {
  'office':   { label: 'Office',  inks: ['c', 'm', 'y', 'k'] },
  'five-lc':  { label: 'Five',    inks: ['c', 'm', 'y', 'k', 'lc'] },
  'five-w':   { label: 'Five',    inks: ['c', 'm', 'y', 'k', 'w'] },
  'photo':    { label: 'Photo',   inks: ['c', 'm', 'y', 'k', 'lc', 'lm'] }
};

const TAGS = { c: 'C', m: 'M', y: 'Y', k: 'K', lc: 'LC', lm: 'LM', w: 'W' };
const VARS = { c: '--cyan', m: '--magenta', y: '--yellow', k: '--key',
               lc: '--lcyan', lm: '--lmagenta', w: '--white' };

let INKS = PALETTES.office.inks;

/* A cell holds a short code rather than a bare color, so a drop can carry a
   property without becoming a seventh thing to tell apart:
     'c'    plain cyan
     'c*'   cyan, magnetic
     '#'    a virus
     '#!'   a virus that has just landed and has not corrupted yet          */
const VIRUS = '#', VIRUS_NEW = '#!';

const inkOf  = (v) => (!v || v === VIRUS || v === VIRUS_NEW) ? null
                    : (v.endsWith('*') ? v.slice(0, -1) : v);
const isMag  = (v) => !!v && v.endsWith('*');
const isBug  = (v) => v === VIRUS || v === VIRUS_NEW;

/* How often the machine misbehaves. The magnet is the reward and stays put;
   the virus is the punishment and gets worse as the printer gets harder. */
const MAG_RATE = 0.12;
const VIRUS_RATE = { 'office': 0.03, 'five-lc': 0.05, 'five-w': 0.05, 'photo': 0.07 };

/* Two ways to burn the corruption off, because one was not enough: a chain
   of this many links, or a single clump of this size. The second matters --
   it gives a player who cannot chain yet a route that is only about
   patience, and on six inks a three link chain was a wall. */
const CURE_AT = { 'office': 2, 'five-lc': 2, 'five-w': 2, 'photo': 2 };
const CURE_CLUMP = 6;

let mode = 'office', virusRate = 0.05, cureAt = 2;

/* Puyo clears start at four, so the table shifts up one from the one we
   drew for a swap board: the smallest clear pays 10, and it climbs the
   same way from there. */
const GROUP_POINTS = { 4: 10, 5: 15, 6: 25 };
const BIG_GROUP    = 50;
const CHAIN_CAP    = 8;

const groupPoints = (n) => (n >= 7 ? BIG_GROUP : GROUP_POINTS[n] || 0);

const idx  = (x, y) => y * COLS + x;
const at   = (w, x, y) => w[idx(x, y)];
const put  = (w, x, y, v) => { w[idx(x, y)] = v; };
const rand = () => INKS[(Math.random() * INKS.length) | 0];
const inside = (x, y) => x >= 0 && x < COLS && y >= 0 && y < ROWS;

/* The second half of a pair, relative to the pivot. */
const ROT = [ [0, -1], [1, 0], [0, 1], [-1, 0] ];

/* Everything floating settles. Each column compacts downward, which also
   gives the Puyo rule for free: when a pair lands straddling a ledge, the
   unsupported half keeps falling on its own. */
function settle(w) {
  for (let x = 0; x < COLS; x++) {
    let write = ROWS - 1;
    for (let y = ROWS - 1; y >= 0; y--) {
      const v = at(w, x, y);
      if (v) { put(w, x, y, null); put(w, x, write, v); write--; }
    }
  }
}

/* Groups of four or more of a color, touching edge to edge in any shape. */
function findClumps(w) {
  const seen = new Uint8Array(COLS * ROWS);
  const clumps = [];

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ink = inkOf(at(w, x, y));
      if (!ink || seen[idx(x, y)]) continue;

      const group = [];
      const queue = [[x, y]];
      seen[idx(x, y)] = 1;

      while (queue.length) {
        const [cx, cy] = queue.pop();
        group.push([cx, cy]);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + dx, ny = cy + dy;
          if (!inside(nx, ny) || seen[idx(nx, ny)]) continue;
          if (inkOf(at(w, nx, ny)) !== ink) continue;
          seen[idx(nx, ny)] = 1;
          queue.push([nx, ny]);
        }
      }

      if (group.length >= 4) clumps.push(group);
    }
  }

  return clumps;
}

/* ============================================================
   The board on the page
   ============================================================ */

const elGrid  = document.getElementById('grid');
const elPts   = document.getElementById('pts');
const elTg    = document.getElementById('tg');
const elBc    = document.getElementById('bc');
const elMsg   = document.getElementById('msg');
const elOver  = document.getElementById('over');
const elChain = document.getElementById('chainnow');

let well = [], piece = null, next = null;
let points = 0, target = 1000, bestChain = 0, fallMs = 700;
let timer = null, busy = false, over = false;

const tiles = [];
for (let i = 0; i < COLS * ROWS; i++) {
  const d = document.createElement('div');
  d.className = 'cell';
  elGrid.appendChild(d);
  tiles.push(d);
}

/* Cells are square and the whole rig has to fit the screen without
   scrolling, so the size is worked out from whichever runs out first,
   the width or the height. */
function sizeBoard() {
  // Measure what the rest of the page is actually taking rather than
  // guessing at it, then give the well the remainder.
  const used = document.querySelector('.head').offsetHeight
             + document.querySelector('.hoppers').offsetHeight
             + document.querySelector('.foot').offsetHeight
             + 44;                       // body padding, well padding, gaps

  const byH = (window.innerHeight - used - ROWS * 3) / ROWS;
  const byW = (Math.min(window.innerWidth, 430) - 96 - COLS * 3) / COLS;
  const cell = Math.max(14, Math.min(byH, byW, 44));

  for (const t of tiles) { t.style.width = cell + 'px'; t.style.height = cell + 'px'; }
  document.querySelectorAll('.nextgrid div').forEach((d) => {
    d.style.width = Math.round(cell * 0.6) + 'px';
    d.style.height = Math.round(cell * 0.6) + 'px';
  });
}

const show = (html) => { elMsg.innerHTML = html; };

/* ---- the tanks ---- */

const REST = 56;
let level = {};
let topUp = null;

function buildHoppers() {
  const box = document.getElementById('hoppers');
  box.innerHTML = '';
  box.style.gridTemplateColumns = 'repeat(' + INKS.length + ', 1fr)';
  level = {};

  for (const ink of INKS) {
    level[ink] = REST;
    const tank = document.createElement('div');
    tank.className = 'hopper ' + ink;
    tank.innerHTML = '<div class="fill" id="hop-' + ink + '"></div>' +
                     '<span class="tag">' + TAGS[ink] + '</span>';
    box.appendChild(tank);
  }
}

function paintHoppers() {
  for (const ink of INKS) {
    const el = document.getElementById('hop-' + ink);
    if (el) el.style.height = level[ink] + '%';
  }
}

function drawInk(counts) {
  for (const ink of INKS) if (counts[ink]) level[ink] = Math.max(16, level[ink] - counts[ink] * 4);
  paintHoppers();
  clearTimeout(topUp);
  topUp = setTimeout(() => { for (const ink of INKS) level[ink] = REST; paintHoppers(); }, 600);
}

/* ---- painting ---- */

function classFor(code) {
  if (!code) return 'cell';
  if (isBug(code)) return 'cell virus';
  return 'cell ' + inkOf(code) + (isMag(code) ? ' mag' : '');
}

function paint() {
  for (let i = 0; i < tiles.length; i++) tiles[i].className = classFor(well[i]);

  if (piece) {
    for (const [x, y, code] of pieceCells(piece)) {
      if (inside(x, y)) tiles[idx(x, y)].className = classFor(code) + ' live';
    }
  }

  paintNext();
}

function paintNext() {
  for (const [id, code] of [['na', next && next.a], ['nb', next && next.b]]) {
    const el = document.getElementById(id);
    el.className = code ? classFor(code).replace('cell', '').trim() : '';
    if (!code) { el.style.background = 'transparent'; el.style.boxShadow = 'none'; return; }
    el.style.background = isBug(code) ? '#11161C' : colorOf(inkOf(code));
    el.style.boxShadow = isBug(code) ? 'inset 0 0 0 3px #43D98B'
                       : isMag(code) ? 'inset 0 0 0 3px ' + getComputedStyle(document.documentElement).getPropertyValue('--accent')
                       : 'none';
  }
}

const colorOf = (ink) => getComputedStyle(document.documentElement)
  .getPropertyValue(VARS[ink] || '--key');

function pieceCells(p) {
  const [dx, dy] = ROT[p.rot];
  return [[p.x, p.y, p.a], [p.x + dx, p.y + dy, p.b]];
}

function fits(p) {
  for (const [x, y] of pieceCells(p)) {
    if (x < 0 || x >= COLS || y >= ROWS) return false;
    if (y >= 0 && at(well, x, y)) return false;      // above the lip is allowed
  }
  return true;
}

/* ---- the run of play ---- */

/* One drop. Mostly plain ink; sometimes magnetic, sometimes a virus. */
function roll() {
  if (Math.random() < virusRate) return VIRUS_NEW;
  return rand() + (Math.random() < MAG_RATE ? '*' : '');
}

function newPair() {
  const p = { x: 2, y: 1, rot: 0, a: roll(), b: roll() };
  // never both halves corrupted -- two at once is a punishment nobody can read
  if (isBug(p.a) && isBug(p.b)) p.b = rand();
  return p;
}

function spawn() {
  piece = next || newPair();
  piece.x = 2; piece.y = 1; piece.rot = 0;
  next = newPair();

  if (!fits(piece)) { piece = null; finish(false); return; }
  paint();
}

/* A virus rewrites the cells it is touching, once, at the moment it settles.
   Only its four neighbours and never again after -- enough to hurt, bounded
   enough that you can look at the board and see what it cost you. */
function corruptNew() {
  let bit = false;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (at(well, x, y) !== VIRUS_NEW) continue;
      put(well, x, y, VIRUS);
      bit = true;

      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (!inside(nx, ny)) continue;
        const v = at(well, nx, ny);
        if (!v || isBug(v)) continue;
        put(well, nx, ny, rand());          // the magnet mark is lost with it
      }
    }
  }

  return bit;
}

/* Magnetic ink drags its own color out of a diagonal and into line: if the
   square above the magnet is free and a matching drop sits diagonally above
   it, that drop slides across. */
function pullMagnets() {
  let moved = false;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const here = at(well, x, y);
      if (!isMag(here)) continue;

      const ink = inkOf(here);
      if (y - 1 < 0 || at(well, x, y - 1)) continue;      // no room above it

      for (const dx of [-1, 1]) {
        const nx = x + dx, ny = y - 1;
        if (!inside(nx, ny)) continue;
        const v = at(well, nx, ny);
        if (!v || isBug(v) || inkOf(v) !== ink) continue;

        put(well, nx, ny, null);
        put(well, x, y - 1, v);
        moved = true;
        break;
      }
    }
  }

  return moved;
}

function lock() {
  for (const [x, y, code] of pieceCells(piece)) {
    if (inside(x, y)) put(well, x, y, code);
  }
  piece = null;
  resolve();
}

const wait = (ms) => new Promise(r => setTimeout(r, ms));

/* Clear, settle, look again. Every pass is one link of the chain and pays
   more than the one before it. */
async function resolve() {
  busy = true;
  stopTick();

  settle(well);

  // a virus bites where it came to rest, not where it was dropped
  if (corruptNew()) { paint(); await wait(150); }

  if (pullMagnets()) { settle(well); paint(); await wait(150); }

  paint();

  let chain = 0;

  for (;;) {
    const clumps = findClumps(well);
    if (!clumps.length) break;

    chain++;
    const mult = Math.min(chain, CHAIN_CAP);
    let pass = 0;
    const used = {};
    for (const ink of INKS) used[ink] = 0;

    for (const group of clumps) {
      pass += groupPoints(group.length) * mult;
      for (const [x, y] of group) {
        const ink = inkOf(at(well, x, y));
        if (ink in used) used[ink]++;
        tiles[idx(x, y)].className = 'cell hit';
      }
    }

    /* A chain this long burns the corruption off the board along with the
       clump that earned it. */
    let cured = 0;
    const bigClump = clumps.some(g => g.length >= CURE_CLUMP);
    if (chain >= cureAt || bigClump) {
      for (let i = 0; i < well.length; i++) {
        if (isBug(well[i])) { tiles[i].className = 'cell hit'; cured++; }
      }
    }

    points += pass;
    elPts.textContent = points;
    elChain.textContent = chain > 1 ? 'Chain ×' + mult : '';
    drawInk(used);
    show((chain > 1
      ? 'Chain <b>&times;' + mult + '</b> &mdash; ' + pass + ' points'
      : clumps.map(g => g.length + ' touching').join(', ') + ' &mdash; <b>' + pass + '</b>')
      + (cured ? ' &middot; burned off ' + cured + ' virus' + (cured === 1 ? '' : 'es') : ''));

    await wait(170);

    for (const group of clumps) for (const [x, y] of group) put(well, x, y, null);
    if (cured) for (let i = 0; i < well.length; i++) if (isBug(well[i])) well[i] = null;

    settle(well);
    if (pullMagnets()) settle(well);
    paint();
    await wait(90);
  }

  if (chain > bestChain) { bestChain = chain; elBc.textContent = bestChain; }
  elChain.textContent = '';
  busy = false;

  if (points >= target) { finish(true); return; }

  spawn();
  startTick();
}

/* ---- gravity ---- */

function tick() {
  if (!piece || busy || over) return;
  const down = { ...piece, y: piece.y + 1 };
  if (fits(down)) { piece = down; paint(); }
  else lock();
}

function startTick() { stopTick(); timer = setInterval(tick, fallMs); }
function stopTick()  { clearInterval(timer); timer = null; }

/* ---- steering ---- */

function move(dx) {
  if (!piece || busy || over) return;
  const to = { ...piece, x: piece.x + dx };
  if (fits(to)) { piece = to; paint(); }
}

/* A rotation that would run into the wall or the pile shoves itself over by
   one and tries again, which is what stops the piece getting stuck in a
   gutter. */
function rotate(dir) {
  if (!piece || busy || over) return;
  const turned = { ...piece, rot: (piece.rot + (dir > 0 ? 1 : 3)) % 4 };
  for (const kick of [0, -1, 1]) {
    const k = { ...turned, x: turned.x + kick };
    if (fits(k)) { piece = k; paint(); return; }
  }
}

function drop() {
  if (!piece || busy || over) return;
  for (;;) {
    const down = { ...piece, y: piece.y + 1 };
    if (!fits(down)) break;
    piece = down;
  }
  paint();
  lock();
}

/* ---- keyboard ---- */

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') move(-1);
  if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
  if (k === 'ArrowDown'  || k === 's' || k === 'S') tick();
  if (k === 'ArrowUp'    || k === 'x' || k === 'X') rotate(1);
  if (k === 'z' || k === 'Z') rotate(-1);
  if (k === ' ') drop();
});

/* ---- touch: drag to steer, tap to rotate, swipe down to drop ---- */

let t0 = null, lastCol = 0, moved = false;

function cellSize() { return tiles[0].getBoundingClientRect().width + 3; }

document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.foot') || e.target.closest('.over')) return;
  t0 = { x: e.clientX, y: e.clientY, t: Date.now() };
  lastCol = 0; moved = false;
});

document.addEventListener('pointermove', (e) => {
  if (!t0 || !piece) return;
  const col = Math.round((e.clientX - t0.x) / cellSize());
  if (col !== lastCol) {
    const step = col > lastCol ? 1 : -1;
    for (let i = 0; i < Math.abs(col - lastCol); i++) move(step);
    lastCol = col;
    moved = true;
  }
});

document.addEventListener('pointerup', (e) => {
  if (!t0) return;
  const dx = e.clientX - t0.x, dy = e.clientY - t0.y;
  const quick = Date.now() - t0.t < 400;
  t0 = null;

  if (dy > 48 && Math.abs(dy) > Math.abs(dx) * 1.4) { drop(); return; }
  if (!moved && Math.abs(dx) < 14 && Math.abs(dy) < 14 && quick) rotate(1);
});

/* ---- a print ---- */

function finish(won) {
  over = true;
  stopTick();
  document.getElementById('overTitle').textContent = won ? 'Print complete' : 'Paper jam';
  document.getElementById('overText').textContent = won
    ? points + ' points. Longest chain: ' + bestChain + '.'
    : 'The well filled up at ' + points + ' of ' + target + '. Longest chain: ' + bestChain + '.';
  elOver.hidden = false;
}

function newPrint() {
  mode = document.getElementById('setInks').value;
  const pick = PALETTES[mode] || PALETTES.office;
  INKS = pick.inks;
  virusRate = VIRUS_RATE[mode] || 0.05;
  cureAt = CURE_AT[mode] || 2;

  target = Math.max(100, Number(document.getElementById('setTarget').value) || 1000);
  fallMs = Math.max(100, Number(document.getElementById('setFall').value) || 700);

  well = new Array(COLS * ROWS).fill(null);
  points = 0; bestChain = 0; over = false; busy = false;
  next = null; piece = null;

  buildHoppers();
  paintHoppers();

  elPts.textContent = '0';
  elTg.textContent = target;
  elBc.textContent = '0';
  elChain.textContent = '';
  elOver.hidden = true;
  show('Four or more touching clears. Gold ring pulls its own color into line; '
     + 'a chain of ' + cureAt + ', or one clump of ' + CURE_CLUMP + ', burns off the green.');

  sizeBoard();
  spawn();
  startTick();
}

document.getElementById('again').addEventListener('click', newPrint);
document.getElementById('overBtn').addEventListener('click', newPrint);
window.addEventListener('resize', sizeBoard);

newPrint();
</script>
