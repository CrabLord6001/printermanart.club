<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Printshop</title>

<!-- The game used to live at this address, under its working title. It moved
     to /games/gallery-printshop.html when the name settled. GitHub Pages
     cannot redirect, so this page does it: the canonical tells search engines
     which address is the real one, and the script below carries anyone who
     still has the old link across -- query string and all, so ?try=21 and
     ?meet=asil keep working. The meta refresh is the fallback for a browser
     running no script. -->
<link rel="canonical" href="https://printermanart.club/games/gallery-printshop.html">
<meta http-equiv="refresh" content="0; url=/games/gallery-printshop.html">
<script>
  location.replace('/games/gallery-printshop.html' + location.search + location.hash);
</script>
</head>
<body>
  <p>Gallery Printshop has moved to
     <a href="/games/gallery-printshop.html">/games/gallery-printshop.html</a>.</p>
</body>
</html>
