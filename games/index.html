<style>
/* The club's tokens, same as the lander and both game pages. */
:root {
  --blurple:       #5865F2;
  --blurple-text:  #99A2F7;
  --ground:        #101218;
  --panel:         #171A22;
  --border:        #272B36;
  --text:          #FFFFFF;
  --text-muted:    #9BA0AE;
  --text-dim:      #7A8094;
  --accent:        #D4A24C;
  --font: 'Poppins', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text-muted);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

/* The same rail both games wear, so moving between a game and this page
   never changes the furniture at the top of the window. */
.sitebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px max(10px, env(safe-area-inset-right)) 7px max(10px, env(safe-area-inset-left));
  background: #0C0E13;
  border-bottom: 1px solid #1B1F29;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.sitebar a { color: var(--text-dim); text-decoration: none; }
.sitebar a:hover { color: var(--accent); }
.sb-home { color: var(--text-muted) !important; font-weight: 600; }
.sb-home:hover { color: var(--accent) !important; }
.sb-nav { display: flex; gap: 14px; overflow: hidden; }

@media (max-width: 560px) {
  .sb-nav { display: none; }
  .sitebar { font-size: 0.58rem; }
}

.col { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; }

header.page { padding: 34px 0 22px; text-align: center; }
header.page h1 {
  margin: 0;
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
header.page .tag {
  margin: 6px 0 0;
  font-size: 0.95rem;
  color: var(--text-dim);
}

/* Two games now, more later: the grid wraps on its own rather than being
   told how many columns to make. */
.shelf {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

.arc-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: #13161D;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.arc-card:hover { border-color: var(--blurple-text); transform: translateY(-2px); }
.arc-card:focus-visible { outline: 2px solid var(--blurple-text); outline-offset: 3px; }

.arc-plate {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 240px;
  padding: 18px;
  background: #0C0E13;
  border-bottom: 1px solid var(--border);
}
.arc-plate svg { width: 100%; height: 100%; display: block; }

.arc-veil {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,12,17,.74);
  color: #fff;
  font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  opacity: 0; transition: opacity .15s;
}
.arc-card:hover .arc-veil, .arc-card:focus-visible .arc-veil { opacity: 1; }

.arc-who { display: block; padding: 16px 18px 18px; text-align: center; }
.arc-name {
  display: block;
  font-size: 1.05rem; font-weight: 600; line-height: 1.35;
  color: var(--blurple-text); text-wrap: balance;
}
.arc-note {
  display: block; margin-top: 4px;
  font-size: .84rem; color: var(--text-dim); text-wrap: balance;
}

footer {
  margin-top: 40px; padding-top: 20px;
  border-top: 1px solid var(--border);
  text-align: center; font-size: .78rem; color: var(--text-dim);
}
footer a { color: var(--blurple-text); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* The name and the copyright are what the site is; the links are what you
   can do here. The line is too long for a phone at any readable size, so
   it breaks on that seam rather than wherever the text happens to run out,
   and the separator that joined the two halves goes with the break instead
   of being stranded at the end of a line. */
.foot-id, .foot-links { display: block; }
.foot-links { margin-top: 5px; }
.foot-sep { padding: 0 3px; }
footer a { white-space: nowrap; }

/* Narrower than this the name and the copyright cannot share a line
   either, so they split on the same principle. */
@media (max-width: 374px) {
  .foot-c { display: block; }
  .foot-idsep { display: none; }
}
</style>
