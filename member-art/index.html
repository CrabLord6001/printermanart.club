<script type="module">
import { approvedWorks, publicUrl, esc } from '/member-art/studio.js';

/* The whole card is already a link to their page, so this cannot be a
   second link inside it -- a mark that one exists, with the working link
   on their page. */
const LINK_GLYPH = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';

const wrap = document.getElementById('artists');
const note = document.getElementById('artistsNote');

function card(a) {
  const plate = a.image_path
    ? '<img src="' + esc(publicUrl(a.image_path)) + '"' +
      (a.image_width ? ' width="' + a.image_width + '" height="' + a.image_height + '"' : '') +
      ' loading="lazy" decoding="async" alt="' + esc(a.alt_text || a.title) + '">'
    : '<span class="ph">No image</span>';

  return '<a class="artist" href="/member-art/artist.html?a=' + encodeURIComponent(a.slug) + '">' +
    '<div class="plate">' + plate + '</div>' +
    '<div class="who">' +
      '<p class="name">' + esc(a.name) +
        (a.link ? ' <span class="has-link" title="Has a link">' + LINK_GLYPH + '</span>' : '') + '</p>' +
      (a.note ? '<p class="note">' + esc(a.note) + '</p>' : '') +
    '</div></a>';
}

(async () => {
  const rows = await approvedWorks(200);

  if (rows === null) {
    note.textContent = 'The gallery is not reachable right now.';
    return;
  }

  /* One card per artist, their most recent approved piece as the image, so
     the directory shows what everyone is making now rather than freezing on
     whatever they happened to put up first. The query comes back newest
     first, so the first row seen for an artist is the one to keep. */
  const byArtist = new Map();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (!r.artist || !r.artist.artist_slug) continue;
    if (byArtist.has(r.member_id)) continue;
    byArtist.set(r.member_id, {
      slug: r.artist.artist_slug,
      name: r.artist.display_name,
      note: r.artist.artist_note,
      link: r.artist.artist_link,
      image_path: r.image_path,
      image_width: r.image_width,
      image_height: r.image_height,
      alt_text: r.alt_text,
      title: r.title
    });
  }

  const artists = [...byArtist.values()];
  if (!artists.length) {
    note.textContent = 'No member art yet.';
    return;
  }

  wrap.innerHTML = artists.map(card).join('');
})();
</script>
